services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: juheng
      POSTGRES_USER: juheng
      POSTGRES_PASSWORD: juheng_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juheng -d juheng"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - juheng-postgres-data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    init: true
    environment:
      JUHENG_FRONTEND_PROXY_TARGET: ${JUHENG_FRONTEND_PROXY_TARGET:-http://host.docker.internal:8080}
      JUHENG_FRONTEND_USE_POLLING: "true"
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/workspace/frontend
      - juheng-frontend-node-modules:/workspace/frontend/node_modules
      - juheng-frontend-npm-cache:/root/.npm

  e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    init: true
    environment:
      JUHENG_E2E_BASE_URL: http://127.0.0.1:5173
      JUHENG_E2E_START_FRONTEND: "true"
      JUHENG_FRONTEND_PROXY_TARGET: ${JUHENG_FRONTEND_PROXY_TARGET:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/playwright-report:/workspace/frontend/playwright-report
      - ./frontend/test-results:/workspace/frontend/test-results

volumes:
  juheng-postgres-data:
  juheng-frontend-node-modules:
  juheng-frontend-npm-cache:
