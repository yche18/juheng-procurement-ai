spring.application.name=juheng-backend

# Local defaults are intentionally non-production credentials and can be overridden by environment variables.
spring.datasource.url=${JUHENG_DB_URL:jdbc:postgresql://localhost:5432/juheng}
spring.datasource.username=${JUHENG_DB_USERNAME:juheng}
spring.datasource.password=${JUHENG_DB_PASSWORD:juheng_local}

# Flyway is the only schema-management mechanism. Hibernate ddl-auto is not configured.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# PostgreSQL UUID columns keep UUID semantics through one explicit MyBatis handler.
mybatis-plus.type-handlers-package=io.github.yche18.juhengbackend.common.persistence

# US-000 exposes only the non-sensitive liveness summary required for local checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never

# US-003 local-only HTTP Basic accounts share this replaceable demo password.
juheng.security.demo-password=${JUHENG_DEMO_PASSWORD:juheng-local}

# R1 uses one explicit, explainable approval candidate; blank or multiple IDs make submission fail closed.
juheng.approval.assignee-ids=${JUHENG_APPROVAL_ASSIGNEE_IDS:demo-approver}
