spring.application.name=juheng-backend

# Local defaults are intentionally non-production credentials and can be overridden by environment variables.
spring.datasource.url=${JUHENG_DB_URL:jdbc:postgresql://localhost:5432/juheng}
spring.datasource.username=${JUHENG_DB_USERNAME:juheng}
spring.datasource.password=${JUHENG_DB_PASSWORD:juheng_local}

# Flyway is the only schema-management mechanism. Hibernate ddl-auto is not configured.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# US-000 exposes only the non-sensitive liveness summary required for local checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
